model:
  distribution_type: ${get_module_attr:otter.models.distributions.Gaussian}
  distribution_kwargs:
    min_std: 1e-9

loss_fn:
  loss_fn: ${get_module_attr:otter.models.losses.loss_fn.mean_neg_log_prob}
  weighting_coefficients_power: 1.0
  weighting_fns:
    # No std weighting, because the NLL already divides by the std.
    - ${get_module_attr:otter.models.losses.weighting.apply_pressure_weighting}
    - ${get_module_attr:otter.models.losses.weighting.apply_surface_weighting}

val_loss_fns:
  # Always include the training loss function in the validation loss functions.
  train_loss: ${loss_fn}
  # Additional loss functions reported exclusively during validation.
  mean_neg_log_prob:
    _target_: otter.models.losses.loss_fn.make_loss_fn
    model: ${model}
    loss_fn: ${get_module_attr:otter.models.losses.loss_fn.mean_neg_log_prob}
    weighting_coefficients_power: 1.0

constants:
  num_stats: 2
