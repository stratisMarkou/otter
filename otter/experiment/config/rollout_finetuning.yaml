defaults:
  - base
  - _self_

forecast_horizon_scheduler:
  _target_: otter.models.architectures.schedulers.ForecastHorizonScheduler
  num_steps: ${constants.num_training_steps}
  max_frame_forecast_horizon: ${constants.data.train_num_target_frames}
  min_frame_forecast_horizon: 2
  temporal_resolution_hours: ${constants.data.temporal_resolution_hours}

+lr_scheduler:
  _target_: otter.experiment.utils.get_linear_warmup_cosine_lr_scheduler
  _partial_: true
  lr_scheduler_kwargs:
    T_max: ${constants.num_training_steps} # Only for `get_cosine_lr_scheduler`.
    warmup_epochs: 2000
  num_steps:

constants:
  data:
    train_start_date: "2007-01-01 00:00:00"
    num_context_frames: 4
    train_num_target_frames: 2
    valid_num_target_frames: 2
    batch_size: 1
    epochs: 1
  #load_weights_from_experiment: /scratches/landau_2/as2975/workspace/_results/best.pt
  load_weights_from_experiment: /mnt/bigdisk/otter/_results/2025-11-06_19-08-bold-wolf/checkpoints/best.pt
  save_checkpoint_every: 1_000
  num_training_steps:
    _target_: otter.experiment.utils.get_num_training_steps
    num_epochs: ${constants.training.epochs}
    dataloader: ${train_dataloader}
  training:
    grad_ckpt_start_timestep: 0
