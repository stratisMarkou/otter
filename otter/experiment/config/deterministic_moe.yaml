defaults:
  - deterministic  # Load a base config
  - _self_

# TODO: we haven't explored the paramters for k, num_experts, w_importance, w_load
feedforward_network:
  _target_: otter.models.architectures.moe.MixtureOfExperts
  _partial_: true
  num_experts: 20
  k: 2
  num_hidden_layers: 2
  hidden_features: 256
  use_gating_bias: False
  apply_softmax_before_top_k: False
  w_importance: 1.0
  w_load: 1.0
