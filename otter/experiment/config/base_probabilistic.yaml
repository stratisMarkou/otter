defaults:
  - base  # Extend the base.yaml config
  - _self_

model:
  distribution_type: ${get_module_attr:otter.models.distributions.Gaussian}

loss_fn:
  loss_fn: ${get_module_attr:otter.models.losses.loss_fn.mean_neg_log_prob}
  weighting_coefficients_power: 2.0

val_loss_fns:
  # Always include the training loss function in the validation loss functions.
  train_loss: ${loss_fn}
  # Additional loss functions reported exclusively during validation.
  mean_neg_log_prob:
    _target_: otter.models.losses.loss_fn.make_loss_fn
    model: ${model}
    loss_fn: ${get_module_attr:otter.models.losses.loss_fn.mean_neg_log_prob}
    weighting_coefficients_power: 2.0

constants:
  num_stats: 2
