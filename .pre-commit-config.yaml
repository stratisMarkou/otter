repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: trailing-whitespace
        always_run: true
    -   id: end-of-file-fixer
        always_run: true
    -   id: check-yaml
        always_run: true
    -   id: check-added-large-files
        always_run: true
-   repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black", "--filter-files"]
        always_run: true
-   repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3.11
        always_run: true
-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
    -   id: mypy
        always_run: true
        args: ["--disallow-untyped-defs", "--strict"]
        additional_dependencies: ["torch", "xarray"]
        language_version: python3.11
        entry: ./debug.sh
-   repo: https://github.com/asottile/blacken-docs
    rev: 1.19.1
    hooks:
    -   id: blacken-docs
        always_run: true
-   repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
    -   id: flake8
        always_run: true
