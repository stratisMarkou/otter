train_dataset:
  _target_: otter.data.datasets.make_gridded_weather_task
  path_to_labelled_array: "/scratch2/em626/_data/era5_240x121_single_array"
  start_date: "1979-01-01"
  end_date: "2019-12-31"
  num_context_frames: ${constants.data.num_context_frames}
  num_target_frames: ${constants.data.num_target_frames}
  temporal_resolution_hours: ${constants.data.temporal_resolution_hours}
  ctx_variables_to_exclude: ${constants.data.ctx_variables_to_remove}
  trg_variables_to_exclude: ${constants.data.trg_variables_to_remove}

valid_dataset:
  _target_: otter.data.datasets.make_gridded_weather_task
  path_to_labelled_array: "/scratch2/em626/_data/era5_240x121_single_array"
  start_date: "2020-01-01"
  end_date: "2020-12-31"
  num_context_frames: ${constants.data.num_context_frames}
  num_target_frames: ${constants.data.num_target_frames}
  temporal_resolution_hours: ${constants.data.temporal_resolution_hours}
  ctx_variables_to_exclude: ${constants.data.ctx_variables_to_remove}
  trg_variables_to_exclude: ${constants.data.trg_variables_to_remove}
  task_sub_sampling_factor: ${constants.data.val_task_subsampling_factor}

train_dataloader:
  _target_: torch.utils.data.DataLoader
  dataset: ${train_dataset}
  batch_size: ${constants.data.batch_size}
  shuffle: true
  num_workers: ${constants.data.num_workers}
  collate_fn: ${constants.data.collate_fn}

valid_dataloader:
  _target_: torch.utils.data.DataLoader
  dataset: ${valid_dataset}
  batch_size: ${constants.data.batch_size}
  shuffle: true
  num_workers: ${constants.data.num_workers}
  collate_fn: ${constants.data.collate_fn}

time_embedding:
  _target_: otter.models.architectures.embeddings.TimeEmbedding
  num_scales: 16

backbone_network:
  _target_: otter.models.architectures.transformer.SwinTransformer
  in_channels: ${eval:'148 + 2 * ${time_embedding.num_scales}'}
  height: 128
  width: 256
  patch_size: 2
  token_dimensions: [512, 512, 512, 512]
  output_dimension: 69
  window_size: 4
  mlp_num_hidden: 256
  mlp_num_layers: 2
  num_heads: 8
  num_blocks_per_stage: [4, 4, 4]

model:
  _target_: otter.models.deterministic_model.make_deterministic_model
  backbone_network: ${backbone_network}
  temporal_resolution_hours: ${constants.data.temporal_resolution_hours}
  time_embedding: ${time_embedding}
  ctx_variables_to_remove: ${constants.data.ctx_variables_to_remove}
  trg_variables_to_remove: ${constants.data.trg_variables_to_remove}
  apply_pressure_weighting_loss: true
  apply_latitude_weighting_loss: true
  apply_difference_weighting: true

optimizer_kwargs:
  lr: ${constants.training.initial_learning_rate}

lr_scheduler_kwargs:
  T_max: ${constants.training.num_training_steps}
  eta_min: 1e-6

constants:
  data:
    train_start_date: "1979-01-01 00:00:00"
    train_end_date: "2019-12-31 18:00:00"
    valid_start_date: "2020-01-01 00:00:00"
    valid_end_date: "2020-12-31 18:00:00"
    temporal_resolution_hours: 6
    ctx_variables_to_remove: ["sea_surface_temperature", "vertical_velocity"]
    trg_variables_to_remove: ["sea_surface_temperature", "vertical_velocity"]
    num_context_frames: 2
    num_target_frames: 1
    batch_size: 4
    num_workers: 2
    collate_fn:
      _target_: otter.data.datasets.get_collate_fn
    # Sub-sampling factor for the validation task, as we don't want to waste
    # lots of time validating while training.
    val_task_subsampling_factor: 5
  training:
    initial_learning_rate: 1e-4
    epochs: 10
    num_training_steps:
      _target_: utils.get_num_training_steps
      num_epochs: ${constants.training.epochs}
      dataloader: ${train_dataloader}
    validate_every: 1000
    save_checkpoint_every: 10_000


info:
  root_results: _results
  wandb_project: otter-deterministic
